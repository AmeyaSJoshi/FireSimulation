<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/src/landing.css" />
  </head>
  <body>
    <div id="bg-frame" aria-hidden="true">
      <picture>
        <img id="bg-photo" src="/earth-on-fire.jpg" alt="" />
      </picture>
      <div id="bg-glow"></div>
      <div id="bg-vignette"></div>
      <div id="bg-grain"></div>
      <div id="scrim" aria-hidden="true"></div>
    </div>

    <div id="foreground">
      <main id="landing-content">
        <div id="text-block">
          <div id="wordmark-wrap">
            <h1 id="wordmark">AETHON</h1>
            <canvas id="wordmark-canvas" aria-hidden="true"></canvas>
          </div>
        </div>
      </main>

      <div id="scroll-affordance" aria-hidden="true">
        <span id="scroll-label">Scroll</span>
        <span id="scroll-indicator"></span>
      </div>
    </div>

    <script type="module" src="/src/landing.js"></script>
  </body>
</html>
